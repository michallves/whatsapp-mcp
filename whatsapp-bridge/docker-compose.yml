# Host outbox, mounted at the same absolute path so the paths the MCP server sends
# on the host also resolve here. Interpolated from the shell running compose (the
# service's HOME below does not apply): run it as the user owning the outbox, not sudo.
x-outbox: &outbox ${HOME:?HOME must be set to locate the outbox}/.local/share/whatsapp-mcp/outbox

services:
  bridge:
    build: .
    container_name: whatsapp-bridge
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    environment:
      HOME: /app/store
      WHATSAPP_BRIDGE_TOKEN: ${WHATSAPP_BRIDGE_TOKEN}
      XDG_DATA_HOME: /app/store/data
      WEBHOOK_ENABLED: ${WEBHOOK_ENABLED:-true}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_NOTIFY_MEDIA: ${WEBHOOK_NOTIFY_MEDIA:-false}
      WHATSAPP_MEDIA_ROOTS: *outbox
    volumes:
      - ./store:/app/store
      - type: bind
        source: *outbox
        target: *outbox
        read_only: true
        bind:
          # Fail instead of letting Docker create it as root: mkdir -p it first.
          create_host_path: false
    command: ["--full-history-pair"]
